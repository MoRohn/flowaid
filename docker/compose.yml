# flowaid default stack: Postgres 16 + pgvector, api, worker, web.
# No Redis: queues and the event bus run over Postgres (ARCHITECTURE.md D10).
# `docker compose --profile scale up` (see compose.scale.yml) adds Redis and worker replicas.
#
# Configuration comes from ../.env (copy ../.env.example; every variable is documented in
# packages/env/README.md). Only `api` and `worker` read the whole file (env_file): `web`
# receives the explicit variables listed below and nothing else, so a compromised web process
# never holds the master key, provider keys or the owner's database password. Values that must
# differ inside the compose network (the database host, data paths, the listen address) are
# pinned per service and override the file. docker/compose.test.ts asserts the per-service
# variable sets; scripts/check-compose.test.ts feeds each service environment to loadEnv().
#
# Code nodes run in isolated-vm isolates inside the worker (memory, CPU and wall-clock limits,
# scoped bridges). Run artifacts and code-export packages live in the `flowaid-data` volume the
# api and worker share.
#
# Images are pinned to a release tag and its digest; renovate bumps them.
#
# Networks:
#   internal  internal: true (no egress): postgres, redis, api, worker. Service-to-service
#             traffic only. `web` is not on it.
#   edge      api, web, worker: the published api/web ports and outbound access (providers,
#             webhooks, MCP servers).
#   admin     postgres, redis: publishes the databases on the host (BIND_ADDRESS, loopback by
#             default) for local development and administration. Published ports do not work
#             on an internal-only network, hence this third one.
#
# Passwords have no defaults: POSTGRES_PASSWORD and POSTGRES_CODE_PASSWORD must be set in
# ../.env (and REDIS_PASSWORD with the scale profile). POSTGRES_CODE_PASSWORD is the password of
# the restricted `flowaid_code` role that migrations grant to (postgres-init/01-roles.sql).

name: flowaid

x-env-file: &env-file
  - path: ../.env
    required: false

x-postgres-image: &postgres-image pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b

# Shared by api and worker (the trusted tier). web gets its own explicit map.
x-service-env: &service-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # api and worker connect as the restricted flowaid_app role (docker/postgres-init/01-roles.sql);
  # the api runs migrations as the owner through DATABASE_ADMIN_URL.
  DATABASE_URL: postgres://flowaid_app:${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB:-flowaid}
  DB_RLS: ${DB_RLS:-true}
  REDIS_URL: ${REDIS_URL:-}
  # FLOWAID_MASTER_KEY (from .env) takes precedence over the key file when both are present.
  FLOWAID_MASTER_KEY: ${FLOWAID_MASTER_KEY:-}
  FLOWAID_MASTER_KEY_FILE: /data/master.key
  FLOWAID_MASTER_KEY_AUTOGENERATE: ${FLOWAID_MASTER_KEY_AUTOGENERATE:-false}
  FLOWAID_JWT_KEYS_DIR: /data/keys
  FLOWAID_PLUGIN_DIR: /data/plugins
  FLOWAID_VENDOR_DIR: /opt/flowaid/vendor
  FLOWAID_BASE_URL: ${FLOWAID_BASE_URL:-http://localhost:3000}
  FLOWAID_WEB_URL: ${FLOWAID_WEB_URL:-http://localhost:3001}

x-worker-security: &worker-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: *postgres-image
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowaid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 16)}
      POSTGRES_DB: ${POSTGRES_DB:-flowaid}
      # Login roles created by postgres-init/01-roles.sql on the first start.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}
      POSTGRES_CODE_PASSWORD: ${POSTGRES_CODE_PASSWORD:?set POSTGRES_CODE_PASSWORD in .env (openssl rand -hex 16); the sandbox host's database password, distinct from POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
      - admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowaid} -d ${POSTGRES_DB:-flowaid}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Fastify API: HTTP, SSE, webhooks, MCP endpoint. Runs migrations at start; never executes nodes.
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    image: flowaid/api:local
    env_file: *env-file
    environment:
      <<: *service-env
      HOST: 0.0.0.0
      PORT: "3000"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      # Owner connection used only for migrations (DATABASE.md).
      DATABASE_ADMIN_URL: postgres://${POSTGRES_USER:-flowaid}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 16)}@postgres:5432/${POSTGRES_DB:-flowaid}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - flowaid-data:/data
    networks:
      - internal
      - edge
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Orchestrator + general-purpose node executors and plugin host (the trusted tier: it holds
  # the master key file and every provider key). Waits for the api so migrations are applied.
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    image: flowaid/worker:local
    env_file: *env-file
    environment:
      <<: *service-env
      WORKER_POOLS: ${WORKER_POOLS:-general,retrieval,browser,high_memory}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      MCP_STDIO_ENABLED: ${MCP_STDIO_ENABLED:-false}
    volumes:
      - flowaid-data:/data
    networks:
      - internal
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    <<: *worker-security
    pids_limit: 1024
    healthcheck:
      test: ["CMD", "node", "dist/health.js"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    restart: unless-stopped

  # Next.js app: builder, runs, trace viewer, human tasks, evaluations, settings. Browsers talk
  # only to it; it forwards /v1, /hooks and /mcp to the api at request time.
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_FLOWAID_BASE_URL: ${FLOWAID_BASE_URL:-http://localhost:3000}
    image: flowaid/web:local
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # Where the web app's proxy reaches the api (read per request, so one image fits any host).
      FLOWAID_API_INTERNAL_URL: http://api:3000
      NEXT_PUBLIC_FLOWAID_BASE_URL: ${FLOWAID_BASE_URL:-http://localhost:3000}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3001}:3000"
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

networks:
  internal:
    internal: true
  edge:
  admin:

volumes:
  postgres-data:
  # Master key file, generated JWT keys and installed plugins, shared by api and worker only.
  flowaid-data:
