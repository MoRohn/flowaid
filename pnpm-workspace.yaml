packages:
  - "apps/*"
  - "packages/*"

# Native/postinstall builds we allow (pnpm blocks dependency scripts by default).
allowBuilds:
  esbuild: true
  argon2: true
  isolated-vm: true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  # optional native speed-up of BullMQ's msgpack; the pure-JS path is used instead
  msgpackr-extract: false
  # its postinstall would install hooks on every install (CI, Docker): the root `prepare`
  # script installs them for contributors instead
  lefthook: false

# pnpm's supply-chain policy refuses very new releases; these were published in
# the last days and are pinned to exact versions we verified.
minimumReleaseAgeExclude:
  - "@codemirror/state@6.7.6"
  - "@codemirror/view@6.43.13"
  - framer-motion@13.4.1
  - motion-dom@13.4.1
  - motion@13.4.1
  - react-resizable-panels@4.13.2
  - fast-check@4.10.2
  - "@modelcontextprotocol/sdk@1.30.1"

# Security overrides for transitive pins upstream hasn't bumped yet.
overrides:
  # @scalar/json-magic pins undici 7.29.0 (GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3)
  "@scalar/json-magic>undici": 7.30.0
