<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FlowAId</title>
    <style>
      @font-face {
        font-family: "Instrument Sans";
        font-weight: 600;
        src: url("../brand/fonts/InstrumentSans-SemiBold.ttf") format("truetype");
      }
      @font-face {
        font-family: "Instrument Sans";
        font-weight: 400;
        src: url("../brand/fonts/InstrumentSans-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 500;
        src: url("../brand/fonts/JetBrainsMono-Medium.ttf") format("truetype");
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f5f5f7;
        color: #17171c;
        font-family: "Instrument Sans", sans-serif;
      }
      .card {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 72px 80px 64px;
        display: flex;
        flex-direction: column;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .lockup img.mark {
        width: 56px;
        height: 56px;
      }
      .lockup img.word {
        height: 28px;
        width: auto;
      }
      .eyebrow {
        margin: 36px 0 0;
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #5f5f69;
      }
      h1 {
        margin: 14px 0 0;
        max-width: 16em;
        font-size: 52px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.05;
      }
      .ruler {
        display: flex;
        gap: 4px;
        height: 10px;
        width: 520px;
        margin-top: auto;
      }
      .ruler i {
        display: block;
        border-radius: 2px;
      }
      .legend {
        display: flex;
        gap: 4px;
        width: 520px;
        margin: 8px 0 0;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: #5f5f69;
      }
      .legend span {
        overflow: hidden;
        white-space: nowrap;
      }
      .legend span:first-child {
        color: #2450d6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="lockup">
        <img class="mark" src="../brand/logo-mark-accent.svg" alt="" />
        <img class="word" src="../brand/logo-wordmark.svg" alt="FlowAId" />
      </div>
      <p class="eyebrow">Public beta · open source</p>
      <h1>Build, run and evaluate AI agents and workflows on your own computer, with typed decisions you can inspect, verify and trust.</h1>
      <div class="ruler" aria-hidden="true">
        <i style="flex: 81; background: #2f5be8"></i>
        <i style="flex: 12; background: #8aa6f4"></i>
        <i style="flex: 4; background: #c6d4fa"></i>
        <i style="flex: 3; background: #e6ecfb"></i>
      </div>
      <p class="legend" aria-hidden="true">
        <span style="flex: 81">security 0.81</span>
        <span style="flex: 12">technical 0.12</span>
        <span style="flex: 4">0.04</span>
        <span style="flex: 3">0.03</span>
      </p>
    </div>
  </body>
</html>
