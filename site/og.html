<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FlowAId</title>
    <style>
      @font-face {
        font-family: "Instrument Sans";
        font-weight: 600;
        src: url("../brand/fonts/InstrumentSans-SemiBold.ttf") format("truetype");
      }
      @font-face {
        font-family: "Instrument Sans";
        font-weight: 400;
        src: url("../brand/fonts/InstrumentSans-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 500;
        src: url("../brand/fonts/JetBrainsMono-Medium.ttf") format("truetype");
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f5f5f7;
        color: #17171c;
        font-family: "Instrument Sans", sans-serif;
      }
      .card {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 52px 48px 48px 56px;
        display: flex;
        align-items: stretch;
        gap: 40px;
        background:
          linear-gradient(#2f5be8, #2f5be8) left / 8px 100% no-repeat,
          #f5f5f7;
      }
      .copy {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .lockup img.mark {
        width: 64px;
        height: 64px;
      }
      .lockup img.word {
        height: 32px;
        width: auto;
      }
      .eyebrow {
        margin: 28px 0 0;
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #5f5f69;
      }
      h1 {
        margin: 16px 0 0;
        font-size: 36px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.12;
      }
      .ruler {
        display: flex;
        gap: 4px;
        height: 10px;
        width: 100%;
        margin-top: auto;
      }
      .ruler i {
        display: block;
        border-radius: 2px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        margin: 10px 0 0;
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.3;
        color: #5f5f69;
      }
      .legend .chosen {
        color: #2450d6;
      }
      .frame {
        flex: none;
        width: 548px;
        border-radius: 14px;
        border: 1px solid #e3e3e8;
        background: #ffffff;
        overflow: hidden;
        box-shadow: 0 16px 40px rgba(23, 23, 28, 0.1);
      }
      .frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: left top;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="copy">
        <div class="lockup">
          <img class="mark" src="../brand/logo-mark-accent.svg" alt="" />
          <img class="word" src="../brand/logo-wordmark.svg" alt="FlowAId" />
        </div>
        <p class="eyebrow">Public beta · open source</p>
        <h1>Build, run and evaluate AI agents and workflows on your own computer, with typed decisions you can inspect, verify and trust.</h1>
        <div class="ruler" aria-hidden="true">
          <i style="flex: 81; background: #2f5be8"></i>
          <i style="flex: 12; background: #8aa6f4"></i>
          <i style="flex: 4; background: #c6d4fa"></i>
          <i style="flex: 3; background: #e6ecfb"></i>
        </div>
        <p class="legend" aria-hidden="true">
          <span class="chosen">security 0.81</span>
          <span>technical 0.12</span>
          <span>billing 0.04</span>
          <span>sales 0.03</span>
        </p>
      </div>
      <div class="frame">
        <img src="../docs/assets/screenshots/overview-light.webp" alt="" />
      </div>
    </div>
  </body>
</html>
