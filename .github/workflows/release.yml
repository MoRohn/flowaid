name: Release

# Pushes to main: open or update the "Version packages" pull request while changesets are pending
# (.changeset/*.md). Once that pull request is merged (no changesets left) and `v<version>` does
# not exist yet, tag it, then build and push the images and create the GitHub release.
# A `v*` tag pushed by hand, or a manual run on a tag, publishes that version the same way.
# docs/RELEASING.md describes the flow and how to verify the images.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  version:
    name: version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pull requests opened with the default token do not start CI; one opened with a GitHub App
      # token or a fine-grained PAT in RELEASE_TOKEN does (contents, pull requests and workflows:
      # read and write on this repository, docs/RELEASING.md). A token that is missing or lacks a
      # permission never blocks a release: the default token opens the pull request instead.
      - name: Open or update the Version packages pull request (RELEASE_TOKEN)
        id: with-token
        if: env.HAS_RELEASE_TOKEN == 'true'
        continue-on-error: true
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          version-script: pnpm version-packages
          commit-message: "Version packages"
          pr-title: "Version packages"
          create-github-releases: false
          push-git-tags: false

      - name: RELEASE_TOKEN was refused
        if: steps.with-token.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # who the token belongs to and what it may do here (never the token itself)
          owner=$(gh api user --jq .login 2>/dev/null || echo "an account the API would not name")
          access=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions | to_entries | map("\(.key)=\(.value)") | join(" ")' 2>/dev/null || echo "no access to $GITHUB_REPOSITORY")
          echo "RELEASE_TOKEN belongs to: $owner; on $GITHUB_REPOSITORY: $access"
          echo "::warning title=RELEASE_TOKEN::The token of $owner could not update the Version packages branch ($access). It must be created by the repository owner, include $GITHUB_REPOSITORY, and have contents, pull requests and workflows read and write (docs/RELEASING.md). Falling back to the default token: CI will not start on that pull request."
          git reset --hard "$GITHUB_SHA"
          git clean -fd
          git checkout --detach "$GITHUB_SHA"
          # the refused attempt created the local branch; the next attempt creates it again
          git branch -D changeset-release/main || true

      - name: Open or update the Version packages pull request
        id: with-default
        if: steps.with-token.outcome != 'success'
        uses: changesets/action@v2
        with:
          github-token: ${{ github.token }}
          version-script: pnpm version-packages
          commit-message: "Version packages"
          pr-title: "Version packages"
          create-github-releases: false
          push-git-tags: false

      - name: Pending changesets
        id: changesets
        run: |
          echo "has-changesets=${{ steps.with-token.outputs.has-changesets || steps.with-default.outputs.has-changesets }}" >> "$GITHUB_OUTPUT"

      - name: Tag the released version
        id: tag
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          version=$(node -p "require('./apps/api/package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already released"
            exit 0
          fi
          if ! grep -q "^## ${version}\b" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${version}: nothing to release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${version}" -m "FlowAId ${version}"
          git push origin "v${version}"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

  meta:
    name: meta
    needs: version
    # a tag this run created (main), or the tag that triggered the run
    if: always() && (needs.version.outputs.tag != '' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        env:
          CREATED: ${{ needs.version.outputs.tag }}
        run: |
          tag="${CREATED:-${GITHUB_REF_NAME}}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  images:
    name: image (${{ matrix.target }})
    needs: meta
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flowaid-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=${{ needs.meta.outputs.prerelease == 'false' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.meta.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.meta.outputs.tag }},enable=${{ needs.meta.outputs.prerelease == 'false' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=flowaid-${{ matrix.target }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ needs.meta.outputs.version }}
            BUILD_DATE=${{ fromJSON(steps.docker-meta.outputs.json).labels['org.opencontainers.image.created'] }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    name: github release
    needs: [meta, images]
    if: always() && needs.meta.result == 'success' && needs.images.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "([^0-9.]|$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo
            echo "### Images"
            echo
            for t in api worker web; do echo "- \`ghcr.io/${owner}/flowaid-${t}:${VERSION}\`"; done
            echo
            echo "Verify with \`gh attestation verify oci://ghcr.io/${owner}/flowaid-api:${VERSION} --owner ${OWNER}\`."
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "FlowAId ${TAG#v}" --notes-file notes.md --verify-tag "${flags[@]}"
          fi
