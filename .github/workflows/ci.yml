name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Startup preflight
        run: pnpm preflight

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Dependency boundaries
        run: pnpm boundaries

      - name: Environment docs are current
        run: pnpm env:check

      - name: UI inventory is current
        run: pnpm ui:inventory:check

      - name: Formatting
        run: pnpm format:check

      - name: Root lint and typecheck
        run: pnpm lint:root && pnpm typecheck:root

      - name: Typecheck, lint and build every package
        run: pnpm turbo run typecheck lint build --continue

      - name: Build the UI playground
        run: pnpm --filter @flowaid/ui build:playground

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Three packages at a time: each Vitest run already uses every core, and running all
      # packages at once starved CPU-heavy property tests past their timeouts.
      - name: Unit and component tests
        run: pnpm turbo run test --concurrency=3

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The image the compose stack runs (docker/compose.yml), pinned by digest.
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        # The image the scale profile runs (docker/compose.scale.yml), pinned by digest.
        image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Superuser connection; every suite creates and drops its own database.
      FLOWAID_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Suites use a unique key prefix per run.
      FLOWAID_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrations, RLS, run store, queue and repositories against PostgreSQL 16
        run: pnpm --filter @flowaid/database test

      - name: BullMQ queue and Redis event bus against the store contract suite
        run: pnpm --filter @flowaid/workflow-runtime test
