name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Startup preflight
        run: pnpm preflight

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Dependency boundaries
        run: pnpm boundaries

      - name: Environment docs are current
        run: pnpm env:check

      - name: UI inventory is current
        run: pnpm ui:inventory:check

      - name: Formatting
        run: pnpm format:check

      - name: Root lint and typecheck
        run: pnpm lint:root && pnpm typecheck:root

      - name: Typecheck, lint and build every package
        run: pnpm turbo run typecheck lint build --continue

      - name: Build the UI playground
        run: pnpm --filter @flowaid/ui build:playground

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Three packages at a time: each Vitest run already uses every core, and running all
      # packages at once starved CPU-heavy property tests past their timeouts.
      - name: Unit and component tests
        run: pnpm turbo run test --concurrency=3
