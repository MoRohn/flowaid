name: Feature request
description: Suggest a capability, a template or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to get done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you imagine it working. Screens, API calls or a workflow sketch are all welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Builder and templates
        - Runs, traces and human tasks
        - Decisions (TypeSafe Jev)
        - Generation, agents and knowledge
        - API, SDK, CLI and MCP
        - Deployment and operations
        - Documentation
