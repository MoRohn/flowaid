version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # major upgrades (test runner, linter, Node types) change the toolchain: they are planned by
    # hand, not proposed weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # the digest-pinned base images: node in the Dockerfile; postgres, redis, rustfs in compose
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
